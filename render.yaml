services:
  - type: web
    name: ritm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///data/ritm.db
      - key: APPLICATIONS_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: ritm-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  - type: worker
    name: ritm-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: SITE_URL
        sync: false
